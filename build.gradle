plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

version = '1.0.0'
group = 'net.flashlightplus'
base { archivesName = 'flashlightplus' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
}

repositories {
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'
    compileOnly 'org.spongepowered:mixin:0.8.5'
    // EMF is only compiled against (its animation hook API). Used at runtime only if installed.
    compileOnly files('libs/entity_model_features-3_3_12-1_20_1-forge.jar',
                      'libs/entity_texture_features-7_2_6-1_20_1-forge.jar')
}

jar {
    manifest {
        attributes([
            'MixinConfigs': 'flashlightplus.mixins.json'
        ])
    }
}
jar.finalizedBy('reobfJar')
